    prd_params:
      container.azureStorageAccountName: $(prd_container_azureStorageAccountName)
      container.genericErrorTemplateId: $(prd_container_genericErrorTemplateId)
      container.verifyEmailTemplateId: $(prd_container_verifyEmailTemplateId)
      container.userFeedbackTemplateId: $(prd_container_userFeedbackTemplateId)
      container.userInviteTemplateId: $(prd_container_userInviteTemplateId)
      container.reportSomethingTemplateId: $(prd_container_reportSomethingTemplateId)
      container.form2SubmissionToDefraTemplateId: $(prd_container_form2SubmissionToDefraTemplateId)
      container.form2ConfirmationToPoliceTemplateId: $(prd_container_form2ConfirmationToPoliceTemplateId)
      container.sendApplicationPackTemplateId: $(prd_container_sendApplicationPackTemplateId)
      container.sendWithdrawalConfirmationTemplateId: $(prd_container_sendWithdrawalConfirmationTemplateId)
      container.emailFirstCertificateTemplateId: $(prd_container_emailFirstCertificateTemplateId)
      container.emailReplacementCertificateTemplateId: $(prd_container_emailReplacementCertificateTemplateId)
    enableServiceNowChangeCreationDev: false
    enableServiceNowChangeCreation: true

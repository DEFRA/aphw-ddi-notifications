      - objectName: TEST-aphw-ddi-notify-api-key
        objectType: secret
  secretObjects:
    - secretName: aphw-ddi-notifications
      type: Opaque
      data:
        - objectName: devtest-ffcahwr-appInsights-connectionString
          key: APPLICATIONINSIGHTS_CONNECTION_STRING
        - objectName: TEST-aphw-ddi-notify-api-key
          key: NOTIFY_API_KEY

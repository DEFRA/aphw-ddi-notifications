---
environment: production
environmentCode: prd
container:
  messageQueueHost: PRDFFCINFSB1001.servicebus.windows.net
  notificationsQueueAddress: aphw-ddi-notifications
  eventsTopicAddress: aphw-ddi-events
secretProviderClass:
  azure:
    keyvaultName: PRDFFCINFKV1001
    objects:
      - objectName: prd-ffcahwr-appinsights-connectionString
        objectType: secret
      - objectName: PRD-aphw-ddi-notify-api-key
        objectType: secret
  secretObjects:
    - secretName: aphw-ddi-notifications
      type: Opaque
      data:
        - objectName: prd-ffcahwr-appinsights-connectionString
          key: APPLICATIONINSIGHTS_CONNECTION_STRING
        - objectName: PRD-aphw-ddi-notify-api-key
          key: NOTIFY_API_KEY
